name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_jev:
        description: "Run live Jev on an owner-reviewed branch (repository owner only)"
        type: boolean
        default: false
  schedule:
    - cron: "17 13 * * 1"
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # PRs never receive Jev credentials. Only the owner can opt a reviewed
      # non-main branch into live evaluation, including when rerunning a job.
      RUN_LIVE_JEV: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.live_jev == true && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:dependencies
      - name: Explicit offline checks (pull requests and non-main refs)
        if: env.RUN_LIVE_JEV != 'true'
        run: npm run check:offline
      - name: Complete checks including required live Jev (trusted main or owner-reviewed branch)
        if: env.RUN_LIVE_JEV == 'true'
        run: npm run check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.JEV_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.JEV_CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-evidence
          path: |
            work/frontend/*.png
            work/frontend/*-review.json
            work/audit/ruby-advisories.json
            work/audit/quality.json
            work/audit/translation-review.json
            work/jev/*/corpus.json
            work/jev/*/report.json
            work/jev/*/review.md
          if-no-files-found: ignore
          retention-days: 14
