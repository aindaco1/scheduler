name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:dependencies
      - name: Explicit offline checks (pull requests and non-main refs)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: npm run check:offline
      - name: Complete checks including required live Jev (trusted main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.JEV_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.JEV_CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-evidence
          path: |
            work/frontend/*.png
            work/frontend/*-review.json
            work/audit/ruby-advisories.json
            work/audit/quality.json
            work/audit/translation-review.json
            work/jev/*/corpus.json
            work/jev/*/report.json
            work/jev/*/review.md
          if-no-files-found: ignore
          retention-days: 14
