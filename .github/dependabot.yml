version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Cloudflare pool 0.22 supports Vitest 4 only. Remove when its peers allow 5+.
    ignore:
      - dependency-name: vitest
        versions: [">=5.0.0"]
    groups:
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
